# Ramya Mart Spring Boot Application Configuration

# Server Port (Render provides $PORT)
server.port=${PORT:8080}

# Optional local overrides for local developer environments
spring.config.import=optional:classpath:application-local.properties

# Detailed error messages for API diagnostics
server.error.include-message=always
server.error.include-binding-errors=always

# Database Configuration (supports Render environment variables)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ramya_mart}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Cloud Connection Pool configuration
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.data-source-properties.sslMode=PREFERRED
spring.datasource.hikari.data-source-properties.allowPublicKeyRetrieval=true

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect