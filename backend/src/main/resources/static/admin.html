<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard - Ramya Mart</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f8;
            color: #222;
        }

        header {
            background: #111827;
            color: white;
            padding: 18px 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 26px;
            font-weight: bold;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        nav a:hover {
            color: #60a5fa;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 35px auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .section {
            background: white;
            padding: 25px;
            border-radius: 12px;

            box-shadow:
                0 3px 12px rgba(0,0,0,0.1);

            margin-bottom: 30px;
        }

        .section h2 {
            margin-bottom: 20px;
        }

        .stats {
            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(200px, 1fr));

            gap: 20px;

            margin-bottom: 30px;
        }

        .stat-card {
            background: white;

            padding: 25px;

            border-radius: 12px;

            text-align: center;

            box-shadow:
                0 3px 12px rgba(0,0,0,0.1);
        }

        .stat-card h2 {
            font-size: 35px;
            margin-bottom: 8px;
        }

        .stat-card p {
            color: #666;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #111827;
            color: white;
        }

        tr:hover {
            background: #f9fafb;
        }

        .delete-btn {
            background: #dc2626;
            color: white;

            border: none;

            padding: 8px 12px;

            border-radius: 6px;

            cursor: pointer;
        }

        .delete-btn:hover {
            background: #b91c1c;
        }

        .status-select {
            padding: 8px;

            border: 1px solid #ccc;

            border-radius: 6px;

            background: white;

            cursor: pointer;
        }

        .update-btn {
            background: #2563eb;
            color: white;

            border: none;

            padding: 8px 12px;

            border-radius: 6px;

            cursor: pointer;

            margin-left: 5px;
        }

        .update-btn:hover {
            background: #1d4ed8;
        }

        .loading {
            text-align: center;
            padding: 20px;
        }

        .error {
            color: red;
            text-align: center;
            padding: 20px;
        }

        .user-role {
            padding: 5px 10px;

            border-radius: 12px;

            background: #e5e7eb;
        }

    </style>

</head>


<body>


<header>

    <div class="logo">
        👑 Ramya Mart Admin
    </div>

    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="seller.html">
            Seller
        </a>

        <a href="buyer.html">
            Buyer
        </a>

        <a href="orders.html">
            Orders
        </a>

    </nav>

</header>


<div class="container">


    <h1>
        👑 Admin Dashboard
    </h1>


    <!-- =====================================
         STATISTICS
    ====================================== -->

    <div class="stats">


        <div class="stat-card">

            <h2 id="productCount">
                0
            </h2>

            <p>
                Total Products
            </p>

        </div>


        <div class="stat-card">

            <h2 id="orderCount">
                0
            </h2>

            <p>
                Total Orders
            </p>

        </div>


        <div class="stat-card">

            <h2 id="userCount">
                0
            </h2>

            <p>
                Total Users
            </p>

        </div>


    </div>


    <!-- =====================================
         PRODUCTS
    ====================================== -->

    <div class="section">

        <h2>
            📦 All Products
        </h2>

        <div
            id="productsContainer"
            class="table-container">

            <div class="loading">
                Loading products...
            </div>

        </div>

    </div>


    <!-- =====================================
         USERS
    ====================================== -->

    <div class="section">

        <h2>
            👥 All Users
        </h2>

        <div
            id="usersContainer"
            class="table-container">

            <div class="loading">
                Loading users...
            </div>

        </div>

    </div>


    <!-- =====================================
         ORDERS
    ====================================== -->

    <div class="section">

        <h2>
            🛍️ All Orders
        </h2>

        <div
            id="ordersContainer"
            class="table-container">

            <div class="loading">
                Loading orders...
            </div>

        </div>

    </div>


</div>


<script>


// =====================================
// LOAD PRODUCTS
// =====================================

async function loadProducts() {

    const container =
        document.getElementById(
            "productsContainer"
        );

    try {

        const response =
            await fetch(
                "http://localhost:8080/api/products"
            );

        if (!response.ok) {

            throw new Error(
                "Products loading failed"
            );
        }

        const products =
            await response.json();


        document.getElementById(
            "productCount"
        ).innerText =
            products.length;


        if (products.length === 0) {

            container.innerHTML =
                "<p>No products available.</p>";

            return;
        }


        let table = `

            <table>

                <tr>

                    <th>ID</th>

                    <th>Product</th>

                    <th>Brand</th>

                    <th>Category</th>

                    <th>Price</th>

                    <th>Stock</th>

                    <th>Action</th>

                </tr>

        `;


        products.forEach(
            function(product) {

                table += `

                    <tr>

                        <td>
                            ${product.id}
                        </td>

                        <td>
                            ${product.name}
                        </td>

                        <td>
                            ${product.brand || "N/A"}
                        </td>

                        <td>
                            ${product.category}
                        </td>

                        <td>
                            ₹${Number(
                                product.price
                            ).toLocaleString("en-IN")}
                        </td>

                        <td>
                            ${product.stock}
                        </td>

                        <td>

                            <button
                                class="delete-btn"
                                onclick="
                                    deleteProduct(
                                        ${product.id}
                                    )
                                "
                            >
                                🗑️ Delete
                            </button>

                        </td>

                    </tr>

                `;

            }
        );


        table += `
            </table>
        `;


        container.innerHTML =
            table;

    }
    catch (error) {

        console.error(error);

        container.innerHTML = `

            <div class="error">

                ❌ Unable to load products.

                <br><br>

                Make sure backend is running.

            </div>

        `;

    }

}



// =====================================
// DELETE PRODUCT
// =====================================

async function deleteProduct(id) {

    const confirmDelete =
        confirm(
            "Are you sure you want to delete this product?"
        );


    if (!confirmDelete) {
        return;
    }


    try {

        const response =
            await fetch(
                "http://localhost:8080/api/products/"
                + id,
                {
                    method: "DELETE"
                }
            );


        const message =
            await response.text();


        if (response.ok) {

            alert(
                "🗑️ " + message
            );

            loadProducts();

        }
        else {

            alert(
                "❌ " + message
            );

        }

    }
    catch (error) {

        console.error(error);

        alert(
            "❌ Backend is not connected!"
        );

    }

}



// =====================================
// LOAD USERS
// =====================================

async function loadUsers() {

    const container =
        document.getElementById(
            "usersContainer"
        );

    try {

        const response =
            await fetch(
                "http://localhost:8080/api/users"
            );


        if (!response.ok) {

            throw new Error(
                "Users loading failed"
            );

        }


        const users =
            await response.json();


        document.getElementById(
            "userCount"
        ).innerText =
            users.length;


        if (users.length === 0) {

            container.innerHTML =
                "<p>No users registered.</p>";

            return;
        }


        let table = `

            <table>

                <tr>

                    <th>ID</th>

                    <th>Username</th>

                    <th>Email</th>

                    <th>Role</th>

                </tr>

        `;


        users.forEach(
            function(user) {

                table += `

                    <tr>

                        <td>
                            ${user.id}
                        </td>

                        <td>
                            ${user.username}
                        </td>

                        <td>
                            ${user.email || "N/A"}
                        </td>

                        <td>

                            <span class="user-role">

                                ${user.role}

                            </span>

                        </td>

                    </tr>

                `;

            }
        );


        table += `
            </table>
        `;


        container.innerHTML =
            table;

    }
    catch (error) {

        console.error(error);

        container.innerHTML = `

            <div class="error">

                ❌ Unable to load users.

                <br><br>

                Make sure backend is running.

            </div>

        `;

    }

}



// =====================================
// LOAD ORDERS
// =====================================

async function loadOrders() {

    const container =
        document.getElementById(
            "ordersContainer"
        );


    try {

        const response =
            await fetch(
                "http://localhost:8080/api/orders"
            );


        if (!response.ok) {

            throw new Error(
                "Orders loading failed"
            );

        }


        const orders =
            await response.json();


        document.getElementById(
            "orderCount"
        ).innerText =
            orders.length;


        if (orders.length === 0) {

            container.innerHTML =
                "<p>No orders available.</p>";

            return;
        }


        let table = `

            <table>

                <tr>

                    <th>
                        Order ID
                    </th>

                    <th>
                        Customer
                    </th>

                    <th>
                        Product
                    </th>

                    <th>
                        Price
                    </th>

                    <th>
                        Quantity
                    </th>

                    <th>
                        Payment
                    </th>

                    <th>
                        Status
                    </th>

                </tr>

        `;


        orders.forEach(
            function(order) {

                table += `

                    <tr>

                        <td>
                            #${order.id}
                        </td>

                        <td>
                            ${order.customerName}
                        </td>

                        <td>
                            ${order.productName}
                        </td>

                        <td>
                            ₹${Number(
                                order.price
                            ).toLocaleString("en-IN")}
                        </td>

                        <td>
                            ${order.quantity}
                        </td>

                        <td>
                            ${order.paymentMethod}
                        </td>

                        <td>

                            <select
                                id="status-${order.id}"
                                class="status-select"
                            >

                                <option value="Order Placed">
                                    Order Placed
                                </option>

                                <option value="Confirmed">
                                    Confirmed
                                </option>

                                <option value="Shipped">
                                    Shipped
                                </option>

                                <option value="Out for Delivery">
                                    Out for Delivery
                                </option>

                                <option value="Delivered">
                                    Delivered
                                </option>

                                <option value="Cancelled">
                                    Cancelled
                                </option>

                            </select>


                            <button
                                class="update-btn"
                                onclick="
                                    updateOrderStatus(
                                        ${order.id}
                                    )
                                "
                            >
                                Save
                            </button>

                        </td>

                    </tr>

                `;

            }
        );


        table += `
            </table>
        `;


        container.innerHTML =
            table;


        // Set current status
        orders.forEach(
            function(order) {

                const select =
                    document.getElementById(
                        "status-" + order.id
                    );


                if (select) {

                    select.value =
                        order.status ||
                        "Order Placed";

                }

            }
        );

    }
    catch (error) {

        console.error(error);

        container.innerHTML = `

            <div class="error">

                ❌ Unable to load orders.

                <br><br>

                Make sure backend is running.

            </div>

        `;

    }

}



// =====================================
// UPDATE ORDER STATUS
// =====================================

async function updateOrderStatus(id) {

    const select =
        document.getElementById(
            "status-" + id
        );


    if (!select) {

        alert(
            "Status selector not found!"
        );

        return;
    }


    const status =
        select.value;


    try {

        const response =
            await fetch(
                "http://localhost:8080/api/orders/"
                + id
                + "/status?status="
                + encodeURIComponent(status),
                {
                    method: "PUT"
                }
            );


        if (!response.ok) {

            const error =
                await response.text();

            alert(
                "❌ Status update failed!\n\n"
                + error
            );

            return;
        }


        alert(
            "✅ Order status updated to: "
            + status
        );


        loadOrders();

    }
    catch (error) {

        console.error(error);

        alert(
            "❌ Backend is not connected!"
        );

    }

}



// =====================================
// PAGE LOAD
// =====================================

document.addEventListener(
    "DOMContentLoaded",
    function() {

        loadProducts();

        loadUsers();

        loadOrders();

    }
);


</script>


</body>

</html>
