<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Orders - Ramya Mart</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f6fa;
            color: #222;
        }

        header {
            background: #111827;
            color: white;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
            font-size: 16px;
        }

        nav a:hover {
            color: #60a5fa;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 40px auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        #ordersContainer {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .order-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.1);
        }

        .order-card h2 {
            margin-bottom: 15px;
            color: #111827;
        }

        .order-card p {
            margin: 8px 0;
            font-size: 16px;
        }

        .status {
            display: inline-block;
            background: #16a34a;
            color: white;
            padding: 7px 14px;
            border-radius: 20px;
            margin-top: 10px;
        }

        .back-btn {
            display: block;
            width: fit-content;
            margin: 30px auto;
            padding: 12px 25px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .back-btn:hover {
            background: #1d4ed8;
        }

        .loading {
            text-align: center;
            font-size: 20px;
        }

        .empty {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 12px;
        }

        .error {
            text-align: center;
            color: red;
            background: white;
            padding: 30px;
            border-radius: 12px;
        }
    </style>
</head>

<body>

<header>

    <div class="logo">
        🛒 Ramya Mart
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="index.html#products">Products</a>
        <a href="buyer.html">Buyer Dashboard</a>
    </nav>

</header>


<div class="container">

    <h1>📦 My Orders</h1>

    <div id="ordersContainer">
        <div class="loading">
            Loading your orders...
        </div>
    </div>

    <a href="index.html" class="back-btn">
        🛍️ Continue Shopping
    </a>

</div>


<script>

async function loadOrders() {

    const container =
        document.getElementById("ordersContainer");

    try {

        const response =
            await fetch("http://localhost:8080/api/orders");

        if (!response.ok) {
            throw new Error("Unable to load orders");
        }

        const orders =
            await response.json();

        container.innerHTML = "";

        if (orders.length === 0) {

            container.innerHTML = `
                <div class="empty">

                    <h2>📦 No Orders Yet</h2>

                    <p>
                        You haven't placed any orders.
                    </p>

                </div>
            `;

            return;
        }


        orders.forEach(function(order) {

            const orderCard =
                document.createElement("div");

            orderCard.className =
                "order-card";


            orderCard.innerHTML = `

                <h2>
                    🧾 Order #${order.id}
                </h2>

                <p>
                    <strong>Product:</strong>
                    ${order.productName}
                </p>

                <p>
                    <strong>Price:</strong>
                    ₹${Number(order.price).toLocaleString("en-IN")}
                </p>

                <p>
                    <strong>Quantity:</strong>
                    ${order.quantity}
                </p>

                <p>
                    <strong>Total:</strong>
                    ₹${(
                        Number(order.price) *
                        Number(order.quantity)
                    ).toLocaleString("en-IN")}
                </p>

                <p>
                    <strong>Customer:</strong>
                    ${order.customerName}
                </p>

                <p>
                    <strong>Phone:</strong>
                    ${order.phone}
                </p>

                <p>
                    <strong>Address:</strong>
                    ${order.address}
                </p>

                <p>
                    <strong>Pincode:</strong>
                    ${order.pincode}
                </p>

                <p>
                    <strong>Payment:</strong>
                    ${order.paymentMethod}
                </p>

                <span class="status">
                    ${order.status}
                </span>

            `;

            container.appendChild(orderCard);

        });

    }
    catch (error) {

        console.error(error);

        container.innerHTML = `

            <div class="error">

                <h2>❌ Unable to load orders</h2>

                <p>
                    Please make sure the Java backend
                    is running on port 8080.
                </p>

            </div>

        `;
    }
}


loadOrders();

</script>

</body>
</html>
