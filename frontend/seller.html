<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Seller Dashboard - Ramya Mart</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }


        body {
            background: #f4f6f8;
            color: #222;
        }


        header {
            background: #111827;
            color: white;

            padding: 18px 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }


        .logo {
            font-size: 26px;
            font-weight: bold;
        }


        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }


        nav a:hover {
            color: #60a5fa;
        }


        .container {
            width: 90%;
            max-width: 1100px;
            margin: 35px auto;
        }


        h1 {
            text-align: center;
            margin-bottom: 30px;
        }


        .form-box {
            background: white;

            padding: 25px;

            border-radius: 12px;

            box-shadow:
                0 3px 12px rgba(0,0,0,0.1);

            margin-bottom: 35px;
        }


        .form-box h2 {
            margin-bottom: 20px;
        }


        input,
        textarea,
        select {

            width: 100%;

            padding: 12px;

            margin: 8px 0 15px;

            border: 1px solid #ccc;

            border-radius: 7px;

            font-size: 15px;
        }


        button {

            border: none;

            padding: 11px 18px;

            border-radius: 7px;

            cursor: pointer;

            font-size: 15px;
        }


        .add-btn {

            background: #2563eb;

            color: white;

            width: 100%;
        }


        .add-btn:hover {

            background: #1d4ed8;
        }


        .products {

            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(250px, 1fr));

            gap: 20px;
        }


        .product-card {

            background: white;

            padding: 20px;

            border-radius: 12px;

            box-shadow:
                0 3px 12px rgba(0,0,0,0.1);
        }


        .product-card h3 {

            margin-bottom: 10px;
        }


        .product-card p {

            margin: 7px 0;
        }


        .edit-btn {

            background: #f59e0b;

            color: white;

            margin-top: 12px;

            width: 100%;
        }


        .edit-btn:hover {

            background: #d97706;
        }


        .delete-btn {

            background: #dc2626;

            color: white;

            margin-top: 10px;

            width: 100%;
        }


        .delete-btn:hover {

            background: #b91c1c;
        }


        .update-btn {

            background: #16a34a;

            color: white;

            width: 100%;

            margin-top: 10px;
        }


        .update-btn:hover {

            background: #15803d;
        }


        .cancel-btn {

            background: #6b7280;

            color: white;

            width: 100%;

            margin-top: 10px;
        }


        .cancel-btn:hover {

            background: #4b5563;
        }


        .message {

            text-align: center;

            padding: 20px;
        }


        .edit-box {

            display: none;

            background: #f9fafb;

            padding: 20px;

            margin-top: 15px;

            border-radius: 10px;

            border: 1px solid #ddd;
        }


        .edit-box h4 {

            margin-bottom: 15px;
        }

    </style>

</head>



<body>


<header>


    <div class="logo">

        🛒 Ramya Mart

    </div>


    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="buyer.html">
            Buyer
        </a>

        <a href="orders.html">
            Orders
        </a>

    </nav>


</header>



<div class="container">


    <h1>
        🏪 Seller Dashboard
    </h1>



    <!-- ================================= -->
    <!-- ADD PRODUCT -->
    <!-- ================================= -->


    <div class="form-box">


        <h2>
            ➕ Add New Product
        </h2>


        <input
            type="text"
            id="productName"
            placeholder="Product Name"
        >


        <input
            type="text"
            id="brand"
            placeholder="Brand"
        >


        <select id="category">

            <option value="">
                Select Category
            </option>

            <option value="Laptops">
                Laptops
            </option>

            <option value="Mobiles">
                Mobiles
            </option>

            <option value="Audio">
                Audio
            </option>

            <option value="Accessories">
                Accessories
            </option>

        </select>


        <textarea
            id="description"
            placeholder="Product Description"
            rows="4"
        ></textarea>


        <input
            type="number"
            id="price"
            placeholder="Price"
        >


        <input
            type="number"
            id="stock"
            placeholder="Stock"
        >


        <button
            class="add-btn"
            onclick="addProduct()"
        >

            ➕ Add Product

        </button>


    </div>



    <!-- ================================= -->
    <!-- PRODUCTS -->
    <!-- ================================= -->


    <div class="form-box">


        <h2>
            📦 My Products
        </h2>


        <div
            id="products"
            class="products"
        >

            <div class="message">

                Loading products...

            </div>

        </div>


    </div>


</div>



<script>


// =====================================
// LOAD PRODUCTS
// =====================================


async function loadProducts() {


    const container =
        document.getElementById("products");


    try {


        const response =
            await fetch(
                "http://localhost:8080/api/products"
            );


        if (!response.ok) {

            throw new Error(
                "Products loading failed"
            );

        }


        const products =
            await response.json();


        container.innerHTML = "";


        if (products.length === 0) {


            container.innerHTML = `

                <div class="message">

                    No products available.

                </div>

            `;


            return;

        }



        products.forEach(
            function(product) {


                const card =
                    document.createElement("div");


                card.className =
                    "product-card";


                card.innerHTML = `


                    <h3>

                        ${product.name}

                    </h3>


                    <p>

                        <strong>
                            Brand:
                        </strong>

                        ${product.brand || "N/A"}

                    </p>


                    <p>

                        <strong>
                            Category:
                        </strong>

                        ${product.category}

                    </p>


                    <p>

                        <strong>
                            Description:
                        </strong>

                        ${product.description || ""}

                    </p>


                    <p>

                        <strong>
                            Price:
                        </strong>

                        ₹${Number(
                            product.price
                        ).toLocaleString("en-IN")}

                    </p>


                    <p>

                        <strong>
                            Stock:
                        </strong>

                        ${product.stock}

                    </p>


                    <button
                        class="edit-btn"
                        onclick="showEditForm(${product.id})"
                    >

                        ✏️ Edit Product

                    </button>


                    <button
                        class="delete-btn"
                        onclick="deleteProduct(${product.id})"
                    >

                        🗑️ Delete Product

                    </button>


                    <!-- EDIT FORM -->


                    <div
                        id="edit-${product.id}"
                        class="edit-box"
                    >


                        <h4>
                            ✏️ Edit Product
                        </h4>


                        <input
                            type="text"
                            id="editName-${product.id}"
                            value="${product.name}"
                            placeholder="Product Name"
                        >


                        <input
                            type="text"
                            id="editBrand-${product.id}"
                            value="${product.brand || ""}"
                            placeholder="Brand"
                        >


                        <select
                            id="editCategory-${product.id}"
                        >

                            <option
                                value="Laptops"
                                ${product.category === "Laptops" ? "selected" : ""}
                            >
                                Laptops
                            </option>


                            <option
                                value="Mobiles"
                                ${product.category === "Mobiles" ? "selected" : ""}
                            >
                                Mobiles
                            </option>


                            <option
                                value="Audio"
                                ${product.category === "Audio" ? "selected" : ""}
                            >
                                Audio
                            </option>


                            <option
                                value="Accessories"
                                ${product.category === "Accessories" ? "selected" : ""}
                            >
                                Accessories
                            </option>

                        </select>


                        <textarea
                            id="editDescription-${product.id}"
                            rows="4"
                            placeholder="Description"
                        >${product.description || ""}</textarea>


                        <input
                            type="number"
                            id="editPrice-${product.id}"
                            value="${product.price}"
                            placeholder="Price"
                        >


                        <input
                            type="number"
                            id="editStock-${product.id}"
                            value="${product.stock}"
                            placeholder="Stock"
                        >


                        <button
                            class="update-btn"
                            onclick="updateProduct(${product.id})"
                        >

                            💾 Save Changes

                        </button>


                        <button
                            class="cancel-btn"
                            onclick="hideEditForm(${product.id})"
                        >

                            ❌ Cancel

                        </button>


                    </div>

                `;


                container.appendChild(card);

            }
        );


    }
    catch (error) {


        console.error(error);


        container.innerHTML = `

            <div class="message">

                ❌ Backend is not connected.

            </div>

        `;

    }

}



// =====================================
// SHOW EDIT FORM
// =====================================


function showEditForm(id) {


    const editBox =
        document.getElementById(
            "edit-" + id
        );


    if (editBox) {

        editBox.style.display =
            "block";

    }

}



// =====================================
// HIDE EDIT FORM
// =====================================


function hideEditForm(id) {


    const editBox =
        document.getElementById(
            "edit-" + id
        );


    if (editBox) {

        editBox.style.display =
            "none";

    }

}



// =====================================
// UPDATE PRODUCT
// =====================================


async function updateProduct(id) {


    const name =
        document.getElementById(
            "editName-" + id
        ).value.trim();


    const brand =
        document.getElementById(
            "editBrand-" + id
        ).value.trim();


    const category =
        document.getElementById(
            "editCategory-" + id
        ).value;


    const description =
        document.getElementById(
            "editDescription-" + id
        ).value.trim();


    const price =
        document.getElementById(
            "editPrice-" + id
        ).value;


    const stock =
        document.getElementById(
            "editStock-" + id
        ).value;



    if (
        name === "" ||
        category === "" ||
        description === "" ||
        price === "" ||
        stock === ""
    ) {


        alert(
            "Please fill all product details."
        );


        return;

    }



    const product = {

        name: name,

        brand: brand,

        category: category,

        description: description,

        price: Number(price),

        stock: Number(stock)

    };



    try {


        const response =
            await fetch(
                "http://localhost:8080/api/products/" + id,
                {

                    method: "PUT",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify(product)

                }
            );


        if (!response.ok) {


            const error =
                await response.text();


            alert(
                "❌ Product could not be updated.\n\n" +
                error
            );


            return;

        }



        alert(
            "✅ Product updated successfully!"
        );


        loadProducts();


    }
    catch (error) {


        console.error(error);


        alert(
            "❌ Backend is not connected!"
        );

    }

}



// =====================================
// ADD PRODUCT
// =====================================


async function addProduct() {


    const name =
        document.getElementById(
            "productName"
        ).value.trim();


    const brand =
        document.getElementById(
            "brand"
        ).value.trim();


    const category =
        document.getElementById(
            "category"
        ).value;


    const description =
        document.getElementById(
            "description"
        ).value.trim();


    const price =
        document.getElementById(
            "price"
        ).value;


    const stock =
        document.getElementById(
            "stock"
        ).value;



    if (
        name === "" ||
        category === "" ||
        description === "" ||
        price === "" ||
        stock === ""
    ) {


        alert(
            "Please fill all product details."
        );


        return;

    }



    const product = {

        name: name,

        brand: brand,

        category: category,

        description: description,

        price: Number(price),

        stock: Number(stock)

    };



    try {


        const response =
            await fetch(
                "http://localhost:8080/api/products",
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify(product)

                }
            );



        if (!response.ok) {


            const error =
                await response.text();


            alert(
                "❌ Product could not be added.\n\n" +
                error
            );


            return;

        }



        alert(
            "✅ Product added successfully!"
        );



        document.getElementById(
            "productName"
        ).value = "";


        document.getElementById(
            "brand"
        ).value = "";


        document.getElementById(
            "category"
        ).value = "";


        document.getElementById(
            "description"
        ).value = "";


        document.getElementById(
            "price"
        ).value = "";


        document.getElementById(
            "stock"
        ).value = "";



        loadProducts();


    }
    catch (error) {


        console.error(error);


        alert(
            "❌ Backend is not connected!"
        );

    }

}



// =====================================
// DELETE PRODUCT
// =====================================


async function deleteProduct(id) {


    const confirmDelete =
        confirm(
            "Are you sure you want to delete this product?"
        );


    if (!confirmDelete) {

        return;

    }



    try {


        const response =
            await fetch(
                "http://localhost:8080/api/products/" + id,
                {

                    method: "DELETE"

                }
            );


        const message =
            await response.text();



        if (response.ok) {


            alert(
                "🗑️ " + message
            );


            loadProducts();

        }
        else {


            alert(
                "❌ " + message
            );

        }

    }
    catch (error) {


        console.error(error);


        alert(
            "❌ Backend is not connected!"
        );

    }

}



// =====================================
// START
// =====================================


loadProducts();


</script>


</body>

</html>
